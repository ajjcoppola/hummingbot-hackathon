<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <defs>
    <style>
      .title { font: 700 28px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Helvetica, Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 2; rx: 12; }
      .box-policy { fill: #eff6ff; stroke: #2563eb; }
      .box-exec { fill: #ecfdf5; stroke: #059669; }
      .box-chain { fill: #fff7ed; stroke: #ea580c; }
      .box-harness { fill: #f8fafc; stroke: #64748b; }
      .label { font: 700 18px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 14px Helvetica, Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #0f172a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .note { font: 500 13px Helvetica, Arial, sans-serif; fill: #b91c1c; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f172a"/>
