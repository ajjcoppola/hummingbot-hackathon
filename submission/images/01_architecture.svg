  <path class="arrow" d="M340,220 H400"/>
  <path class="arrow" d="M700,220 H760"/>
  <path class="arrow" d="M1020,220 H1080"/>
  <path class="arrow" d="M1210,300 V400"/>
  <path class="arrow" d="M200,400 V300"/>

  <rect x="60" y="620" width="1280" height="100" class="box"/>
  <text x="80" y="655" class="label">Scoring objective (48h finals)</text>
  <text x="80" y="685" class="small">Maximize Fees - Realized IL - Gas | Volume 40% / PnL 40% / HBOT Vote 20%</text>
  <text x="80" y="705" class="small">Code freeze 2026-08-31 | Demo shows Devnet Gateway proof, not fabricated mainnet PnL</text>
